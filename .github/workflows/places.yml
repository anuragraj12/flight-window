name: Build place packs

# Runs when the pipeline changes, on the 1st of each month, or by hand
# (Actions tab > Build place packs > Run workflow).
on:
  workflow_dispatch:
    inputs:
      bbox:
        description: "Optional test area w,s,e,n (empty = all of India)"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["pipeline/**", ".github/workflows/places.yml"]
  schedule:
    - cron: "17 3 1 * *"

permissions:
  contents: write

concurrency:
  group: places
  cancel-in-progress: true  # a newer pipeline replaces a running one

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipeline/requirements.txt
      - name: Offline test
        run: python pipeline/test_pipeline.py
      - name: Build packs
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          ARGS=""
          if [ -n "${{ github.event.inputs.bbox }}" ]; then ARGS="--bbox ${{ github.event.inputs.bbox }}"; fi
          python pipeline/build_places.py --out public/places $ARGS 2>&1 | tee pipeline/out/last_run.log
      - name: Commit packs and report
        if: always()
        run: |
          git config user.name "Anurag Raj"
          git config user.email "anuragraj12@users.noreply.github.com"
          git add pipeline/out
          if [ "${{ steps.build.outcome }}" = "success" ]; then git add public/places; fi
          git diff --cached --quiet && exit 0
          git commit -m "Place packs: ${{ steps.build.outcome }} ($(date -u +%F))"
          git pull --rebase origin main
          git push
      - name: Fail if build failed
        if: steps.build.outcome != 'success'
        run: exit 1
