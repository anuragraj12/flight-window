name: Build landscapes

# The ecoregion layer changes rarely: runs when its script changes, or by hand.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["pipeline/build_landscapes.py", "pipeline/requirements-landscapes.txt", ".github/workflows/landscapes.yml"]

permissions:
  contents: write

concurrency:
  group: landscapes
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipeline/requirements-landscapes.txt
      - name: Build landscapes
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p pipeline/out
          python pipeline/build_landscapes.py 2>&1 | tee pipeline/out/landscapes.log
      - name: Commit layer and log
        if: success() || failure()
        run: |
          git config user.name "Anurag Raj"
          git config user.email "anuragraj12@users.noreply.github.com"
          git add pipeline/out/landscapes.log
          if [ "${{ steps.build.outcome }}" = "success" ]; then git add public/data/eco.json; fi
          git diff --cached --quiet && exit 0
          git commit -m "Landscapes: ${{ steps.build.outcome }} ($(date -u +%F))"
          git pull --rebase -X theirs origin main
          git push
      - name: Fail if build failed
        if: steps.build.outcome != 'success'
        run: exit 1
